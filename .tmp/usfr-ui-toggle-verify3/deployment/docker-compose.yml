name: usfr

x-runtime: &runtime
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    target: ${USFR_DOCKER_TARGET:-production}
    args:
      USFR_INSTALL_MODE: ${USFR_INSTALL_MODE:-full}
  image: ${USFR_IMAGE:-usfr:local}
  restart: unless-stopped
  environment: &runtime-environment
    USFR_DEPLOYMENT_FACTORY: ${USFR_DEPLOYMENT_FACTORY:-server.packaged_factory:build_runtime}
    USFR_PORT_FACTORY: ${USFR_PORT_FACTORY:-server.packaged_ports:build_ports}
    USFR_READINESS_ONLY: ${USFR_READINESS_ONLY:-false}
    USFR_CAPABILITY_SECRET: ${USFR_CAPABILITY_SECRET:?set at least 32 UTF-8 bytes}
    USFR_PROFILE_MODE: ${USFR_PROFILE_MODE:-shadow}
    USFR_REDIS_URL: redis://redis:6379/0
    USFR_S3_ENDPOINT: ${USFR_S3_ENDPOINT:-http://minio:9000}
    USFR_S3_BUCKET: ${USFR_S3_BUCKET:-usfr-media}
    USFR_ALLOWED_OSS_HOSTS: ${USFR_ALLOWED_OSS_HOSTS:-}
    USFR_OSS_ENDPOINT: ${USFR_OSS_ENDPOINT:-}
    USFR_OSS_BUCKET: ${USFR_OSS_BUCKET:-}
    USFR_OSS_ACCESS_KEY_ID: ${USFR_OSS_ACCESS_KEY_ID:-}
    USFR_OSS_ACCESS_KEY_SECRET: ${USFR_OSS_ACCESS_KEY_SECRET:-}
    USFR_OSS_PUBLIC_BASE_URL: ${USFR_OSS_PUBLIC_BASE_URL:-}
    USFR_OSS_FINAL_PREFIX: ${USFR_OSS_FINAL_PREFIX:-usfr}
    USFR_JOB_TERMINAL_TTL_SECONDS: ${USFR_JOB_TERMINAL_TTL_SECONDS:-604800}
    USFR_TEMPORARY_RETENTION_SECONDS: ${USFR_TEMPORARY_RETENTION_SECONDS:-0}
    USFR_UI_OPERATION_MIN_RATE: ${USFR_UI_OPERATION_MIN_RATE:-0.85}
    USFR_UI_OPERATION_MAX_RATE: ${USFR_UI_OPERATION_MAX_RATE:-1.20}
    USFR_UI_REBUILD_ENABLED: ${USFR_UI_REBUILD_ENABLED:-false}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    OPENAI_MODEL_CONFIG_SHA256: ${OPENAI_MODEL_CONFIG_SHA256:-}
    RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
    RUNNINGHUB_SEEDANCE_API_KEY: ${RUNNINGHUB_SEEDANCE_API_KEY:-}
    RUNNINGHUB_BASE_URL: ${RUNNINGHUB_BASE_URL:-}
    RUNNINGHUB_SEEDANCE_CREATE_URL: ${RUNNINGHUB_SEEDANCE_CREATE_URL:-}
    RUNNINGHUB_SEEDANCE_QUERY_URL: ${RUNNINGHUB_SEEDANCE_QUERY_URL:-}
    RUNNINGHUB_SEEDANCE_UPLOAD_URL: ${RUNNINGHUB_SEEDANCE_UPLOAD_URL:-}
    RUNNINGHUB_SEEDANCE_CONFIG_SHA256: ${RUNNINGHUB_SEEDANCE_CONFIG_SHA256:-}
    RUNNINGHUB_WHISPER_WORKFLOW_ID: ${RUNNINGHUB_WHISPER_WORKFLOW_ID:-}
    RUNNINGHUB_WHISPER_INPUT_NODE_ID: ${RUNNINGHUB_WHISPER_INPUT_NODE_ID:-12}
    RUNNINGHUB_WHISPER_INPUT_FIELD: ${RUNNINGHUB_WHISPER_INPUT_FIELD:-audio}
    USFR_UPLOADED_AUDIO_CLASSIFIER_ENDPOINT: ${USFR_UPLOADED_AUDIO_CLASSIFIER_ENDPOINT:-}
    USFR_UPLOADED_AUDIO_CLASSIFIER_MODEL_ID: ${USFR_UPLOADED_AUDIO_CLASSIFIER_MODEL_ID:-}
    USFR_UPLOADED_AUDIO_CLASSIFIER_MODEL_SHA256: ${USFR_UPLOADED_AUDIO_CLASSIFIER_MODEL_SHA256:-}
    USFR_UPLOADED_AUDIO_CLASSIFIER_API_TOKEN: ${USFR_UPLOADED_AUDIO_CLASSIFIER_API_TOKEN:-}
  depends_on:
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    <<: *runtime
    command:
      - python
      - -B
      - -m
      - uvicorn
      - server.deployment_bootstrap:build_http_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${USFR_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *runtime
    environment:
      <<: *runtime-environment
      USFR_PROCESS_ROLE: worker
      USFR_WORKER_CONSUMER: ${USFR_WORKER_CONSUMER:-}

  sweeper:
    <<: *runtime
    environment:
      <<: *runtime-environment
      USFR_PROCESS_ROLE: sweeper
      USFR_SWEEPER_INTERVAL_SECONDS: ${USFR_SWEEPER_INTERVAL_SECONDS:-30}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - until mc alias set local http://minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}"; do sleep 1; done; mc mb --ignore-existing local/${USFR_S3_BUCKET:-usfr-media}
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}

  e2e:
    <<: *runtime
    restart: "no"
    profiles:
      - e2e
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      minio:
        condition: service_started
    environment:
      <<: *runtime-environment
      USFR_PORT_FACTORY: validation.e2e.ports:build_ports
      USFR_READINESS_ONLY: false
      USFR_E2E_API: http://api:8080
      USFR_E2E_PUBLIC_OBJECT_BASE: http://minio:9000
    command: ["python", "-B", "-m", "validation.e2e.public_http_driver"]
