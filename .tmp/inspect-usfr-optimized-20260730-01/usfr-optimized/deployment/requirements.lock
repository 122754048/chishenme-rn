# Universal Source Fidelity worker baseline. Model weights live in immutable
# mounted artifacts or separately deployed OCR/VLM sidecars; the worker never
# downloads them or treats a workstation path as runtime authority.
#
# Every semantic model call in the packaged deployment is a remote HTTPS
# contract: ASR uses the RunningHub Whisper workflow, semantics use the GPT
# Responses API, and OCR/UI/QC use evidence-bound HTTP backends.  No local
# inference runtime is imported by the server package, so torch,
# onnxruntime-gpu, and openai-whisper are intentionally absent and the worker
# requires no GPU.
