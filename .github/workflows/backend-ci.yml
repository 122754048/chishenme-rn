name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  # Runs ruff in advisory mode. Existing code predates ruff config, so we do not
  # block on it until a dedicated cleanup PR lands a ruff.toml / pyproject ruleset.
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff (non-blocking until ruff config lands)
        run: ruff check app/ tests/ || true

  # ── Test (SQLite) ───────────────────────────────────────────────────────────
  test:
    name: Test (SQLite, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      FREE_DAILY_QUOTA: "3"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (unittest discover)
        run: python -m unittest discover -s tests -v

  # ── Test with PostgreSQL ────────────────────────────────────────────────────
  test-postgres:
    name: Test (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teller_test
          POSTGRES_USER: teller
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://teller:testpassword@localhost:5432/teller_test
      APP_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      FREE_DAILY_QUOTA: "3"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # db.py's init_db() is idempotent and will create any missing tables at
      # first use. We run Alembic as an advisory migration (continue-on-error)
      # since existing tests rely on init_db rather than alembic upgrade head.
      - name: Run Alembic migrations (advisory)
        run: alembic upgrade head
        continue-on-error: true

      - name: Run tests (unittest discover)
        run: python -m unittest discover -s tests -v

  # ── Build Docker image ──────────────────────────────────────────────────────
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: teller-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: |
          SIZE=$(docker image inspect teller-backend:${{ github.sha }} \
            --format='{{.Size}}' 2>/dev/null || echo "0")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ "${SIZE_MB}" -gt 300 ]; then
            echo "�?Image exceeds 300MB limit (${SIZE_MB} MB)"
            exit 1
          fi
          echo "�?Image size OK (${SIZE_MB} MB)"
