name: usfr

x-runtime: &runtime
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    target: ${USFR_DOCKER_TARGET:-production}
    args:
      USFR_INSTALL_MODE: ${USFR_INSTALL_MODE:-control-plane}
  image: ${USFR_IMAGE:-usfr:local}
  restart: unless-stopped
  environment: &runtime-environment
    USFR_DEPLOYMENT_FACTORY: ${USFR_DEPLOYMENT_FACTORY:-server.packaged_factory:build_runtime}
    USFR_PORT_FACTORY: ${USFR_PORT_FACTORY:-}
    USFR_READINESS_ONLY: ${USFR_READINESS_ONLY:-false}
    USFR_CAPABILITY_SECRET: ${USFR_CAPABILITY_SECRET:?set at least 32 UTF-8 bytes}
    USFR_PROFILE_MODE: ${USFR_PROFILE_MODE:-shadow}
    USFR_REDIS_URL: redis://redis:6379/0
    USFR_S3_ENDPOINT: ${USFR_S3_ENDPOINT:-http://minio:9000}
    USFR_S3_BUCKET: ${USFR_S3_BUCKET:-usfr-media}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    <<: *runtime
    command:
      - python
      - -B
      - -m
      - uvicorn
      - server.deployment_bootstrap:build_http_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${USFR_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *runtime
    environment:
      <<: *runtime-environment
      USFR_PROCESS_ROLE: worker
      USFR_WORKER_CONSUMER: ${USFR_WORKER_CONSUMER:-}

  sweeper:
    <<: *runtime
    environment:
      <<: *runtime-environment
      USFR_PROCESS_ROLE: sweeper
      USFR_SWEEPER_INTERVAL_SECONDS: ${USFR_SWEEPER_INTERVAL_SECONDS:-30}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    profiles:
      - e2e
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles:
      - e2e
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - until mc alias set local http://minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}"; do sleep 1; done; mc mb --ignore-existing local/${USFR_S3_BUCKET:-usfr-media}
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}

  e2e:
    <<: *runtime
    restart: "no"
    profiles:
      - e2e
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      minio:
        condition: service_started
    environment:
      <<: *runtime-environment
      USFR_PORT_FACTORY: validation.e2e.ports:build_ports
      USFR_READINESS_ONLY: false
      USFR_E2E_API: http://api:8080
    command: ["python", "-B", "-m", "validation.e2e.driver"]
