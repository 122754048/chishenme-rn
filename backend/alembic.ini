# alembic.ini — Teller backend Alembic configuration
# Place this file at: backend/alembic.ini

[alembic]
# Path to migration scripts (relative to this file = backend/alembic/)
script_location = alembic

# Template for new migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Max length for slug
truncate_slug_length = 40

# sys.path insertion
prepend_sys_path = .

# Version table name (default: alembic_version)
version_table = alembic_version

# Output encoding
output_encoding = utf-8

[post_write_hooks]
# (optional) format generated migrations with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
